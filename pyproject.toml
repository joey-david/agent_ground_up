[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-ground-up"
version = "0.1.0"
description = "A small multimodal coding agent and its SFT/RL training pipeline"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "openai>=1.68",
    "pillow>=10",
    "pyyaml>=6",
    "rich>=13",
    "transformers>=5.2",
    "torchvision>=0.24",
]

[project.optional-dependencies]
train = [
    "accelerate>=1.2",
    "bitsandbytes>=0.45",
    "datasets>=3.2",
    "peft>=0.14",
    "trl>=1.8,<1.9",
    "websockets>=14",
]
sandbox = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
]
dev = [
    "pytest>=8",
    "ruff>=0.9",
    "torch>=2.6",
]
[tool.setuptools.packages.find]
include = ["agent_ground_up*", "infra*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
