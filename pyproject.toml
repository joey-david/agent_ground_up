[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-ground-up"
version = "0.3.0"
description = "A compact self-evolving coding agent running Bonsai 2 directly through MLX"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pillow>=10",
    "pyyaml>=6",
    "rich>=13",
]

[project.optional-dependencies]
local = [
    "huggingface-hub>=0.34",
    "jinja2>=3.1",
    "mlx==0.32.0",
    "mlx-lm==0.31.3",
    "mlx-vlm==0.6.3",
    "numpy>=2.0",
    "tokenizers>=0.21",
    "transformers==5.5.0",
]
train = [
    "datasets>=3.2",
]
dev = [
    "pytest>=8",
    "ruff>=0.9",
]

[tool.setuptools.packages.find]
include = ["agent_ground_up*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
