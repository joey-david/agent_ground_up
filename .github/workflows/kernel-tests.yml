name: kernel-tests

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install portable test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "pillow>=10" "pyyaml>=6" "rich>=13" "pytest>=8"
      - name: Check local-only layout
        run: |
          test -e configs/local.yaml
          test -e agent_ground_up/bonsai.py
          test -e agent_ground_up/runtime.py
          test ! -e configs/lamgate.yaml
          test ! -e configs/astra.yaml
          test ! -e agent_ground_up/factory.py
          test ! -e agent_ground_up/remote_env.py
          test ! -e infra
      - name: Compile
        run: python -m compileall -q agent_ground_up scripts practice
      - name: Run portable tests
        run: pytest -q tests
