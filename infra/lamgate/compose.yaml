name: agent-ground-up-lamgate

services:
  llm:
    image: vllm/vllm-openai:v0.19.1
    ipc: host
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      HF_TOKEN: ${HF_TOKEN:-}
    volumes:
      - hf-cache:/root/.cache/huggingface
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    command: >-
      Qwen/Qwen3.6-27B
      --host 0.0.0.0
      --port 8000
      --tensor-parallel-size ${VLLM_TP:-1}
      --max-model-len 32768
      --enable-auto-tool-choice
      --tool-call-parser qwen3_coder
      --reasoning-parser qwen3
      --disable-uvicorn-access-log

volumes:
  hf-cache:
